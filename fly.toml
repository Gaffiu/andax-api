# fly.toml app configuration file generated for andax-api on 2026-11-18T14:41:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "andax-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "uvicorn app:app --host 0.0.0.0 --port 10000"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"
