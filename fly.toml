# fly.toml app configuration file generated for andax-api on 2026-11-18T14:41:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "andax-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "uvicorn app:app --host 0.0.0.0 --port 10000"

[[services]]
  internal_port = 10000
  processes = ["web"]
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
